name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Repository contract
        run: python scripts/validate_repository.py
      - name: MARGOS host-native adapter contract
        run: python scripts/validate_margos_host_adapters.py
      - name: MARGOS context contract
        run: python scripts/validate_margos_context.py
      - name: MARGOS child-context contract
        run: python scripts/validate_margos_handoff.py
      - name: MARGOS evaluation/privacy contract
        run: python scripts/validate_margos_evaluation.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: MARGOS frozen routing benchmark
        run: python scripts/benchmark_margos_routing.py --mode fixture --strict
      - name: MARGOS frozen context benchmark (policy)
        run: python scripts/benchmark_margos_context.py --mode policy --strict
      - name: MARGOS frozen context benchmark (fixture)
        run: python scripts/benchmark_margos_context.py --mode fixture --strict
      - name: Python harness self-test
        run: python skills/python-engineering-harness/scripts/self_test.py
      - name: Agent Plugin validation
        run: python skills/agent-plugins-author/scripts/validate_agent_plugin.py .
      - name: Skill design validation
        run: python skills/agent-plugins-author/scripts/validate_skill_design.py .
      - name: Codex marketplace drift
        run: python skills/agent-plugins-author/scripts/render_marketplace.py . --check
      - name: Copilot marketplace drift
        run: python skills/agent-plugins-author/scripts/render_copilot_marketplace.py . --check
      - name: Surface reconciliation
        run: python skills/agent-plugins-author/scripts/reconcile_surfaces.py .
      - name: Reproducible release
        run: python scripts/build_release.py --check-reproducible


  cleanup_non_main_branches:
    name: cleanup non-main branches
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[cleanup-non-main-branches]')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Delete every non-main branch
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin |
            awk '{sub("refs/heads/", "", $2); print $2}' |
            while IFS= read -r branch; do
              if [ "$branch" = "main" ]; then
                continue
              fi
              echo "Deleting branch: $branch"
              git push origin --delete "$branch"
            done
          remaining="$(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}')"
          if [ "$remaining" != "main" ]; then
            echo "Expected only main after cleanup; found:"
            printf '%s\n' "$remaining"
            exit 1
          fi
          echo "Branch cleanup verified: main is the only branch."
